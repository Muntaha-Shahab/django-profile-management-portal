{% extends 'base.html' %}
{% block title %}Signup - Profila{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-5" style="max-width:400px;width:100%;">
        <div class="text-center mb-4">
            <i class="bi bi-person-circle fs-1 text-primary"></i>
            <h2 class="mt-2">Profila</h2>
        </div>

        {% if message %}<div class="alert alert-danger">{{ message }}</div>{% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3"><input type="text" name="username" class="form-control" placeholder="Username" required></div>
            <div class="mb-3"><input type="email" name="email" class="form-control" placeholder="Email" required></div>
            <div class="mb-3"><input type="password" name="password" class="form-control" placeholder="Password" required></div>
            <div class="mb-4"><input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required></div>
            <button type="submit" class="btn btn-primary w-100">Signup</button>
            <p class="text-center mt-3">Already have an account? <a href="{% url 'login' %}" class="link-text">Login</a></p>
        </form>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Account Activated - Profila{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-5 text-center" style="max-width:400px;width:100%;">
        <div class="mb-4">
            <i class="bi bi-check-circle-fill fs-1 text-success"></i>
            <h2 class="mt-3">Welcome to Profila!</h2>
            <p class="text-muted">Your account has been successfully activated.</p>
        </div>

        <div class="alert alert-success d-flex align-items-center justify-content-center">
            <i class="bi bi-person-check me-2"></i>
            You can now create your professional profile
        </div>

        <a href="{% url 'login' %}" class="btn btn-primary w-100 mt-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>Go to Login
        </a>
    </div>
</div>
{% endblock %}

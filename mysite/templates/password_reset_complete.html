{% extends 'base.html' %}
{% block title %}Password Reset Complete - Profila{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-5 text-center" style="max-width:400px;width:100%;">
        <!-- Success Icon -->
        <i class="bi bi-check-circle-fill fs-1 text-success mb-3"></i>
        
        <!-- Heading -->
        <h2>Password Reset Successful!</h2>
        
        <!-- Subtext -->
        <p class="text-muted">Your password has been changed successfully. You can now log in with your new password.</p>
        
        <!-- Action Button -->
        <a href="{% url 'login' %}" class="btn btn-primary mt-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>Go to Login
        </a>
    </div>
</div>
{% endblock %}

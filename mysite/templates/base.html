<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Profila{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<style>
:root {
    --primary: #6366f1;
    --primary-light: #818cf8;
    --primary-dark: #4f46e5;
    --secondary: #64748b;
}
* {margin:0;padding:0;box-sizing:border-box;}
body {
    font-family:'Inter',sans-serif;
    min-height:100vh;
    background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
    overflow-x:hidden;
}
.bg-animation {position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1;}
.circle {position:absolute; border-radius:50%; background: linear-gradient(135deg, rgba(99,102,241,0.1) 0%, rgba(99,102,241,0.05) 100%); animation: float 25s infinite linear;}
.circle:nth-child(1){width:300px;height:300px;top:10%;left:5%;}
.circle:nth-child(2){width:200px;height:200px;top:60%;right:10%; animation-duration:28s;}
.circle:nth-child(3){width:150px;height:150px;bottom:10%;left:20%; animation-duration:30s;}
.circle:nth-child(4){width:250px;height:250px;top:20%;right:20%;}
@keyframes float {0% {transform: translateY(0) rotate(0deg);} 33% {transform: translateY(-30px) rotate(120deg);} 66% {transform: translateY(20px) rotate(240deg);} 100% {transform: translateY(0) rotate(360deg);}}
.card {background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius:24px; padding:40px; box-shadow:0 20px 40px rgba(99,102,241,0.08);}
.btn-primary {background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); border:none;}
.btn-primary:hover {transform:translateY(-2px);}
.link-text{color:var(--secondary); text-decoration:none;}
.link-text:hover{color:var(--primary);}
.footer{text-align:center;margin-top:40px;color:#94a3b8;font-size:14px;}
</style>
</head>
<body>
<div class="bg-animation">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

{% block content %}{% endblock %}

<div class="footer">&copy; 2026 Profila. All rights reserved.</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

{% extends 'base.html' %}
{% block title %}Login - Profila{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-5" style="max-width:400px;width:100%;">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill fs-1 text-primary"></i>
            <h2 class="mt-2">Profila</h2>
            <p class="text-muted">Secure Login</p>
        </div>

        {% if message %}
        <div class="alert alert-danger">{{ message }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Username" required>
            </div>
            <div class="mb-2">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3"><i class="bi bi-box-arrow-in-right me-2"></i>Login</button>

            <!-- Forgot Password  -->
            <div class="text-center mb-3">
                <a href="{% url 'password_reset' %}" class="link-text" style="font-size:14px;">Forgot Password?</a>
            </div>

            <p class="text-center">Don't have an account? <a href="{% url 'signup' %}" class="link-text">Sign up</a></p>
        </form>
    </div>
</div>
{% endblock %}

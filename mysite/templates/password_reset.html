{% extends 'base.html' %}
{% block title %}Reset Password - Profila{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-5" style="max-width:400px;width:100%;">
        <div class="text-center mb-4">
            <i class="bi bi-lock fs-1 text-primary"></i>
            <h2 class="mt-2">Reset Password</h2>
            <p class="text-muted">Enter your email to receive reset instructions</p>
        </div>

        {% if message %}<div class="alert alert-success">{{ message }}</div>{% endif %}
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <input type="email" name="email" class="form-control" placeholder="Email" required>
            </div>
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-envelope me-2"></i>Send Reset Link</button>
            <p class="text-center mt-3"><a href="{% url 'login' %}" class="link-text">Back to Login</a></p>
        </form>
    </div>
</div>
{% endblock %}

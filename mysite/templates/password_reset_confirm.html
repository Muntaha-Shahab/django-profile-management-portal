{% extends 'base.html' %}
{% block title %}Set New Password - Profila{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-5" style="max-width:400px;width:100%;">
        <div class="text-center mb-4">
            <i class="bi bi-key fs-1 text-primary"></i>
            <h2 class="mt-2">Set New Password</h2>
            <p class="text-muted">Enter your new password below</p>
        </div>

        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <input type="password" name="new_password1" class="form-control" placeholder="New Password" required>
            </div>
            <div class="mb-4">
                <input type="password" name="new_password2" class="form-control" placeholder="Confirm Password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check2-circle me-2"></i>Reset Password</button>
            <p class="text-center mt-3"><a href="{% url 'login' %}" class="link-text">Back to Login</a></p>
        </form>
    </div>
</div>
{% endblock %}
